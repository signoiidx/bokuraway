<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bokuraway</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap');

  :root {
    --bg:        #0f0f14;
    --surface:   #17171f;
    --surface2:  #1e1e2a;
    --border:    #2a2a3a;
    --accent:    #7c6aff;
    --accent2:   #ff6a9b;
    --text:      #d8d8e8;
    --muted:     #6a6a82;
    --c-fc:      #f0abfc;
    --c-exhard:  #ffd700;
    --c-hard:    #f0f0f0;
    --c-clear:   #6ac8ff;
    --c-easy:    #44ff88;
    --c-assist:  #a855f7;
    --c-failed:  #ff4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── titlebar ── */
  #titlebar {
    height: 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    -webkit-app-region: drag;
    user-select: none;
    flex-shrink: 0;
  }
  #titlebar .logo {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #titlebar .user-info {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    -webkit-app-region: no-drag;
  }

  /* ── layout ── */
  #app { flex: 1; display: flex; overflow: hidden; }

  /* ── auth screen ── */
  #auth-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  #auth-screen h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #auth-screen p { color: var(--muted); font-size: 14px; }

  /* ── main screen ── */
  #main-screen { display: none; flex: 1; overflow: hidden; }
  #main-screen.active { display: flex; }

  /* ── sidebar ── */
  #sidebar {
    width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 0;
    flex-shrink: 0;
  }
  .nav-item {
    padding: 10px 20px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: color .15s, background .15s;
    border-left: 2px solid transparent;
  }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(124,106,255,.08); }
  .nav-icon { font-size: 16px; }

  /* ── content ── */
  #content { flex: 1; overflow-y: auto; padding: 28px; }
  #content::-webkit-scrollbar { width: 6px; }
  #content::-webkit-scrollbar-track { background: transparent; }
  #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .page { display: none; }
  .page.active { display: block; }

  .page-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 6px;
    color: #fff;
  }
  .page-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }

  /* ── buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border-radius: 6px;
    border: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:hover { opacity: .85; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #5b4de0); color: #fff; }

  /* ── stat grid ── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .stat-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
  .stat-value { font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; color: #fff; }
  .stat-value.c-fc     { color: var(--c-fc); }
  .stat-value.c-hard   { color: var(--c-hard); }
  .stat-value.c-clear  { color: var(--c-clear); }
  .stat-value.c-easy   { color: var(--c-easy); }
  .stat-value.c-accent { color: var(--accent); }

  /* ── tab bar ── */
  .tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 8px 18px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── score list ── */
  .score-list { display: flex; flex-direction: column; gap: 6px; }
  .score-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 16px;
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: center;
    gap: 12px;
    transition: border-color .15s;
  }
  .score-item:hover { border-color: var(--accent); }
  .score-rank {
    font-family: 'Rajdhani', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
  }
  .score-title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-artist {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .bp-badge { font-size: 10px; color: var(--muted); }
  .nudge-badge {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(124,106,255,.12);
    border: 1px solid rgba(124,106,255,.3);
    border-radius: 3px;
    padding: 1px 6px;
    white-space: nowrap;
  }
  .score-item.uncharted { opacity: 0.45; }
  .score-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }

  /* ── lamp badge ── */
  .lamp-badge {
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .lamp-FC     { background: rgba(200,100,255,.12); }
  .lamp-FC .rainbow-text {
    background: linear-gradient(90deg, #ff5555, #ffcc00, #44ee44, #00ccff, #cc55ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lamp-EXHARD { background: rgba(255,215,0,.15);   color: var(--c-exhard); }
  .lamp-HARD   { background: rgba(240,240,240,.12); color: var(--c-hard); }
  .lamp-CLEAR  { background: rgba(106,200,255,.15); color: var(--c-clear); }
  .lamp-EASY   { background: rgba(68,255,136,.15);  color: var(--c-easy); }
  .lamp-ASSIST  { background: rgba(168,85,247,.15);  color: var(--c-assist); }
  .lamp-FAILED  { background: rgba(255,68,68,.15);   color: var(--c-failed); }
  .lamp-NOPLAY  { background: rgba(100,100,120,.12); color: var(--muted); }

  /* ── level badge ── */
  .lv-badge {
    display: inline-block;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  /* ── filter bar ── */
  .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 12px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--accent); }
  .filter-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); }

  /* ── stats table ── */
  .stats-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .stats-table th {
    text-align: center;
    padding: 8px 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .stats-table th:first-child { text-align: left; }
  .stats-table td {
    padding: 7px 10px;
    text-align: center;
    border-bottom: 1px solid rgba(42,42,58,.4);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--border);
  }
  .stats-table td:first-child { text-align: left; font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); }
  .stats-table td:last-child { color: var(--muted); font-size: 13px; }
  .stats-table tr:hover td { background: rgba(255,255,255,.015); }
  .cell-fc     { color: var(--c-fc)     !important; }
  .cell-exhard { color: var(--c-exhard) !important; }
  .cell-hard   { color: var(--c-hard)   !important; }
  .cell-clear  { color: var(--c-clear)  !important; }
  .cell-easy   { color: var(--c-easy)   !important; }
  .cell-assist { color: var(--c-assist) !important; }
  .cell-failed { color: var(--c-failed) !important; }

  /* ── level section ── */
  .level-section { margin-bottom: 24px; }
  .level-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
    padding: 6px 0;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .level-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0;
    white-space: nowrap;
  }
  .level-progress {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .level-progress-fill {
    height: 100%;
    background: var(--c-hard);
    border-radius: 2px;
  }

  /* ── status / loader ── */
  .status { font-size: 13px; color: var(--muted); padding: 40px 0; text-align: center; }
  .dot-loader::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 100% { content: ''; }
    25%       { content: '.'; }
    50%       { content: '..'; }
    75%       { content: '...'; }
  }
</style>
</head>
<body>

<div id="titlebar">
  <span class="logo">BOKURAWAY</span>
  <span class="user-info" id="user-chip"></span>
</div>

<div id="app">

  <!-- 認証画面 -->
  <div id="auth-screen">
    <h1>BOKURAWAY</h1>
    <p>Bokutachiアカウントでログインして、BMS上達をサポートします</p>
    <button class="btn btn-primary" id="btn-login">⚡ Bokutachiでログイン</button>
    <p id="auth-status" style="font-size:12px;color:var(--muted);min-height:20px"></p>
  </div>

  <!-- メイン画面 -->
  <div id="main-screen">
    <nav id="sidebar">
      <div class="nav-item active" data-page="recommend">
        <span class="nav-icon">🎯</span> レコメンド
      </div>
      <div class="nav-item" data-page="stats">
        <span class="nav-icon">📈</span> ランプ統計
      </div>
      <div class="nav-item" data-page="scores">
        <span class="nav-icon">📊</span> スコア一覧
      </div>
      <div class="nav-item" data-page="tables">
        <span class="nav-icon">📋</span> 難易度表
      </div>
    </nav>

    <div id="content">

      <!-- レコメンドページ -->
      <div class="page active" id="page-recommend">
        <div class="page-title">NEXT CHALLENGE</div>
        <div class="page-sub">上達のための次の一手をレコメンド</div>
        <div id="recommend-stats" class="stat-grid"></div>
        <div class="tab-bar">
          <button class="tab active" data-tab="nudges">🔔 あと一歩</button>
          <button class="tab" data-tab="toHard">HARD CLEAR 狙い</button>
          <button class="tab" data-tab="toEasy">EASY CLEAR 狙い</button>
        </div>
        <div class="score-list" id="recommend-list">
          <div class="status dot-loader">読み込み中</div>
        </div>
      </div>

      <!-- ランプ統計ページ -->
      <div class="page" id="page-stats">
        <div class="page-title">LAMP STATS</div>
        <div class="page-sub">難易度別クリアランプ分布</div>
        <div id="stats-totals" class="stat-grid"></div>
        <div id="stats-table-wrap">
          <div class="status dot-loader">読み込み中</div>
        </div>
      </div>

      <!-- 難易度表ページ -->
      <div class="page" id="page-tables">
        <div class="page-title">DIFFICULTY TABLES</div>
        <div class="page-sub">難易度表別スコア一覧（プレイ済みのみ）</div>
        <div class="tab-bar" id="table-tab-bar">
          <button class="tab active" data-table="insane">発狂難易度</button>
          <button class="tab" data-table="satellite">Satellite</button>
          <button class="tab" data-table="stella">Stella</button>
          <button class="tab" data-table="overjoy">Overjoy</button>
        </div>
        <div id="table-stats" class="stat-grid"></div>
        <div class="score-list" id="table-list">
          <div class="status dot-loader">読み込み中</div>
        </div>
      </div>

      <!-- スコアページ -->
      <div class="page" id="page-scores">
        <div class="page-title">SCORE LIST</div>
        <div class="page-sub">ベストスコア一覧</div>
        <div class="filter-bar" id="score-filter-bar"></div>
        <div class="score-list" id="score-list">
          <div class="status dot-loader">読み込み中</div>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
let currentUser       = null;
let recommendData     = null;
let allScores         = null;
let statsData         = null;
let activeRecommendTab = 'nudges';
let activeScoreLamp   = 'ALL';

const LAMP_ORDER = { FAILED: 0, ASSIST: 1, EASY: 2, CLEAR: 3, HARD: 4, EXHARD: 5, FC: 6 };

// ── nav ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('page-' + el.dataset.page).classList.add('active');
    if (el.dataset.page === 'tables') renderTableView();
  });
});

// ── auth ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-login').addEventListener('click', async () => {
  const status = document.getElementById('auth-status');
  status.textContent = 'ブラウザを開いています…';
  const result = await window.tachi.startOAuth();
  if (!result.success) { status.textContent = 'エラー: ' + result.error; return; }
  status.textContent = 'ユーザー情報を取得中…';
  try {
    const me = await window.tachi.getMe();
    currentUser = me.user ?? me;
    document.getElementById('user-chip').textContent = currentUser.username;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').classList.add('active');
    Promise.all([loadRecommend(), loadStats(), loadScores()]);
    loadTableData();
  } catch(e) {
    status.textContent = 'ユーザー情報の取得に失敗しました';
  }
});

// ── lamp helpers ──────────────────────────────────────────────────────────────
function lampCat(lamp) {
  if (!lamp) return 'FAILED';
  const l = lamp.toUpperCase();
  if (l.includes('FULL COMBO')) return 'FC';
  if (l.startsWith('EX HARD'))  return 'EXHARD';
  if (l === 'HARD CLEAR' || l === 'HARD') return 'HARD';
  if (l === 'CLEAR')            return 'CLEAR';
  if (l === 'EASY CLEAR' || l === 'EASY') return 'EASY';
  if (l.includes('ASSIST'))     return 'ASSIST';
  return 'FAILED';
}

const LAMP_LABEL = { FC: 'FULL COMBO', EXHARD: 'EX HARD', HARD: 'HARD', CLEAR: 'CLEAR', EASY: 'EASY', ASSIST: 'ASSIST', FAILED: 'FAILED' };

function lampBadge(lamp) {
  const cat = lampCat(lamp);
  const label = cat === 'FC'
    ? `<span class="rainbow-text">${LAMP_LABEL[cat]}</span>`
    : LAMP_LABEL[cat];
  return `<span class="lamp-badge lamp-${cat}">${label}</span>`;
}

function getLevel(chart) {
  return chart?.levelNum ?? (parseFloat(chart?.level) || 0);
}

// 譜面が合致する全テーブルの難易度表記を返す。どこにも載っていなければ "-"
function getTableLabels(s) {
  const md5 = (s.chart?.data?.hashMD5 || '').toLowerCase();
  if (!md5) return '-';
  const entries = tableIndex.get(md5);
  return entries && entries.length > 0 ? entries.map(e => e.level).join(' / ') : '-';
}

function scoreItemHTML(s, rank, lvLabel) {
  const lv = lvLabel !== undefined
    ? lvLabel
    : tableDataLoaded
      ? getTableLabels(s)
      : (s.chart?.data?.aiLevel ?? ('☆' + getLevel(s.chart)));
  const title  = s.chart?.songTitle || s.chartID;
  const artist = s.chart?.artist    || '';
  const bp     = s.scoreData?.optional?.bp;
  return `
    <div class="score-item">
      <div class="score-rank">${rank}</div>
      <div>
        <div class="score-title">${title}</div>
        ${artist ? `<div class="score-artist">${artist}</div>` : ''}
        <div class="score-meta">
          <span class="lv-badge">${lv}</span>
          ${bp != null ? `<span class="bp-badge">BP ${bp}</span>` : ''}
          ${s.nudge ? `<span class="nudge-badge">🔔 ${s.nudge.reason}</span>` : ''}
        </div>
      </div>
      <div class="score-right">${lampBadge(s.scoreData?.lamp)}</div>
    </div>`;
}

function unchartedItemHTML(entry, rank) {
  return `
    <div class="score-item uncharted">
      <div class="score-rank">${rank}</div>
      <div>
        <div class="score-title">${entry.title || '(no title)'}</div>
        <div class="score-meta"><span class="lv-badge">${entry.level}</span></div>
      </div>
      <div class="score-right"><span class="lamp-badge lamp-NOPLAY">NO PLAY</span></div>
    </div>`;
}

// ── recommend ────────────────────────────────────────────────────────────────
async function loadRecommend() {
  const list    = document.getElementById('recommend-list');
  const statsEl = document.getElementById('recommend-stats');
  try {
    recommendData = await window.tachi.getRecommend(currentUser.id ?? currentUser.username);
    if (recommendData.noProfile) {
      statsEl.innerHTML = '';
      list.innerHTML = '<div class="status">Bokutachi に BMS 7K のプレイデータが見つかりません。スコアをインポートしてください。</div>';
      return;
    }
    statsEl.innerHTML = `
      <div class="stat-card">
        <div class="stat-label">あと一歩</div>
        <div class="stat-value c-accent">${(recommendData.nudges ?? []).length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">HARD CLEAR 候補</div>
        <div class="stat-value c-hard">${recommendData.toHard.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">EASY CLEAR 候補</div>
        <div class="stat-value c-easy">${recommendData.toEasy.length}</div>
      </div>`;
    renderRecommendList();
  } catch(e) {
    list.innerHTML = `<div class="status">取得エラー: ${e.message}</div>`;
  }
}

function renderRecommendList() {
  if (!recommendData) return;
  const list   = document.getElementById('recommend-list');
  const scores = recommendData[activeRecommendTab] ?? [];
  if (scores.length === 0) {
    const msg = activeRecommendTab === 'nudges'
      ? '「あと一歩」の譜面が見つかりません。BP率の低い譜面やグレード境界（A/AA/AAA）に近い譜面がここに表示されます。'
      : activeRecommendTab === 'toHard'
        ? 'HARD CLEAR候補がありません。EASY CLEAR数を増やしましょう！'
        : 'EASY CLEAR候補がありません。';
    list.innerHTML = `<div class="status">${msg}</div>`;
    return;
  }
  list.innerHTML = scores.map((s, i) => scoreItemHTML(s, i + 1)).join('');
}

document.querySelectorAll('#page-recommend .tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#page-recommend .tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    activeRecommendTab = btn.dataset.tab;
    renderRecommendList();
  });
});

// ── stats ─────────────────────────────────────────────────────────────────────
async function loadStats() {
  const wrap     = document.getElementById('stats-table-wrap');
  const totalsEl = document.getElementById('stats-totals');
  try {
    statsData = await window.tachi.getStats(currentUser.id);
    const { totals, byLevel, total } = statsData;

    const hardPlus  = totals.HARD + totals.EXHARD + totals.FC;
    const clearPlus = totals.CLEAR + hardPlus;

    totalsEl.innerHTML = [
      ['総譜面数',   total,             ''],
      ['FC',         totals.FC + totals.EXHARD, 'c-fc'],
      ['HARD以上',   hardPlus,          'c-hard'],
      ['CLEAR以上',  clearPlus,         'c-clear'],
      ['EASY以上',   clearPlus + totals.EASY, 'c-easy'],
    ].map(([label, val, cls]) => `
      <div class="stat-card">
        <div class="stat-label">${label}</div>
        <div class="stat-value ${cls}">${val}</div>
      </div>`).join('');

    const levels = Object.keys(byLevel)
      .map(Number).filter(n => !isNaN(n))
      .sort((a, b) => a - b);

    if (levels.length === 0) { wrap.innerHTML = '<div class="status">データがありません</div>'; return; }

    const COLS = ['FC', 'EXHARD', 'HARD', 'CLEAR', 'EASY', 'ASSIST', 'FAILED'];
    const HEAD_LABEL = { FC: 'FC', EXHARD: 'EX HARD', HARD: 'HARD', CLEAR: 'CLEAR', EASY: 'EASY', ASSIST: 'ASSIST', FAILED: 'FAILED' };

    const header = `<tr>
      <th>Level</th>
      ${COLS.map(c => `<th>${HEAD_LABEL[c]}</th>`).join('')}
      <th>Total</th>
    </tr>`;

    const rows = levels.map(lv => {
      const row = byLevel[lv] ?? {};
      const rowTotal = COLS.reduce((s, c) => s + (row[c] ?? 0), 0);
      return `<tr>
        <td>☆${lv}</td>
        ${COLS.map(c => {
          const n = row[c] ?? 0;
          return `<td class="${n > 0 ? 'cell-' + c.toLowerCase() : ''}">${n > 0 ? n : '–'}</td>`;
        }).join('')}
        <td>${rowTotal}</td>
      </tr>`;
    }).join('');

    wrap.innerHTML = `<table class="stats-table"><thead>${header}</thead><tbody>${rows}</tbody></table>`;
  } catch(e) {
    wrap.innerHTML = `<div class="status">取得エラー: ${e.message}</div>`;
  }
}

// ── scores ────────────────────────────────────────────────────────────────────
async function loadScores() {
  const list      = document.getElementById('score-list');
  const filterBar = document.getElementById('score-filter-bar');
  try {
    const raw = await window.tachi.getScores(currentUser.id);

    // best lamp per chart
    const best = new Map();
    for (const s of raw) {
      if (!s.chartID) continue;
      const prev  = best.get(s.chartID);
      const curr  = LAMP_ORDER[lampCat(s.scoreData?.lamp)] ?? -1;
      const prev_ = prev ? (LAMP_ORDER[lampCat(prev.scoreData?.lamp)] ?? -1) : -1;
      if (!prev || curr > prev_) best.set(s.chartID, s);
    }

    allScores = [...best.values()].sort((a, b) => {
      const la = LAMP_ORDER[lampCat(a.scoreData?.lamp)] ?? -1;
      const lb = LAMP_ORDER[lampCat(b.scoreData?.lamp)] ?? -1;
      return lb - la || getLevel(b.chart) - getLevel(a.chart);
    });

    const FILTERS = ['ALL', 'FC', 'EXHARD', 'HARD', 'CLEAR', 'EASY', 'ASSIST', 'FAILED'];
    const FILTER_LABEL = { ALL: 'すべて', FC: 'FC', EXHARD: 'EX HARD', HARD: 'HARD', CLEAR: 'CLEAR', EASY: 'EASY', ASSIST: 'ASSIST', FAILED: 'FAILED' };

    filterBar.innerHTML = FILTERS.map(f => `
      <button class="filter-btn${f === 'ALL' ? ' active' : ''}" data-lamp="${f}">
        ${FILTER_LABEL[f]}
      </button>`).join('');

    filterBar.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeScoreLamp = btn.dataset.lamp;
        renderScoreList();
      });
    });

    renderScoreList();
    if (document.getElementById('page-tables').classList.contains('active')) renderTableView();
  } catch(e) {
    list.innerHTML = `<div class="status">取得エラー: ${e.message}</div>`;
  }
}

function renderScoreList() {
  if (!allScores) return;
  const list     = document.getElementById('score-list');
  const filtered = activeScoreLamp === 'ALL'
    ? allScores
    : allScores.filter(s => lampCat(s.scoreData?.lamp) === activeScoreLamp);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="status">該当するスコアがありません</div>';
    return;
  }
  list.innerHTML = filtered.slice(0, 100).map((s, i) => scoreItemHTML(s, i + 1)).join('');
}

// ── difficulty tables ─────────────────────────────────────────────────────────
let activeTableTab = 'insane';
// md5 → DiffTableEntry[]  (1曲が複数テーブルに載ることがあるため配列)
let tableIndex = new Map();
let tableDataLoaded = false;

async function loadTableData() {
  document.getElementById('table-list').innerHTML = '<div class="status dot-loader">難易度表を取得中</div>';
  try {
    const data = await window.tachi.getTableData();
    tableIndex = new Map();
    for (const entries of Object.values(data)) {
      for (const entry of entries) {
        if (!entry.md5) continue;
        const key = entry.md5.toLowerCase();
        if (!tableIndex.has(key)) tableIndex.set(key, []);
        tableIndex.get(key).push(entry);
      }
    }
    console.log('Table index:', tableIndex.size, 'charts');
    tableDataLoaded = true;
    renderTableView();
  } catch(e) {
    document.getElementById('table-list').innerHTML = `<div class="status">難易度表の取得に失敗: ${e.message}</div>`;
  }
}

function renderTableView() {
  const listEl  = document.getElementById('table-list');
  const statsEl = document.getElementById('table-stats');

  if (!allScores || !tableDataLoaded) {
    listEl.innerHTML  = '<div class="status dot-loader">読み込み中</div>';
    statsEl.innerHTML = '';
    return;
  }

  // Match played scores against the active table
  const mapped = allScores.map(s => {
    const allEntries = tableIndex.get((s.chart?.data?.hashMD5 || '').toLowerCase()) ?? [];
    return { s, entry: allEntries.find(e => e.table === activeTableTab) ?? null };
  });
  const tableScores     = mapped.filter(({ entry }) => entry !== null);
  const unmatchedScores = mapped.filter(({ entry }) => entry === null);

  // Find table entries that have no matching played score (未挑戦)
  const playedMD5s = new Set(
    allScores.map(s => (s.chart?.data?.hashMD5 || '').toLowerCase()).filter(Boolean)
  );
  const unplayedEntries = [];
  for (const [md5, entries] of tableIndex) {
    const entry = entries.find(e => e.table === activeTableTab);
    if (entry && !playedMD5s.has(md5)) unplayedEntries.push(entry);
  }

  const counts = { FC: 0, EXHARD: 0, HARD: 0, CLEAR: 0, EASY: 0, ASSIST: 0, FAILED: 0 };
  for (const { s } of tableScores) counts[lampCat(s.scoreData?.lamp)]++;
  const hardPlus  = counts.HARD + counts.EXHARD + counts.FC;
  const clearPlus = counts.CLEAR + hardPlus;

  statsEl.innerHTML = [
    ['テーブル総数', tableScores.length + unplayedEntries.length, ''],
    ['HARD以上',    hardPlus,                                     'c-hard'],
    ['CLEAR以上',   clearPlus,                                    'c-clear'],
    ['未挑戦',      unplayedEntries.length,                       ''],
  ].map(([label, val, cls]) => `
    <div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value ${cls}">${val}</div>
    </div>`).join('');

  if (tableScores.length === 0 && unplayedEntries.length === 0) {
    listEl.innerHTML = '<div class="status">このテーブルのスコアがありません</div>';
    return;
  }

  // Group played and unplayed by level
  const byLevel = {};
  for (const { s, entry } of tableScores) {
    const lv = entry.levelNum;
    if (!byLevel[lv]) byLevel[lv] = { played: [], unplayed: [] };
    byLevel[lv].played.push({ s, entry });
  }
  for (const entry of unplayedEntries) {
    const lv = entry.levelNum;
    if (!byLevel[lv]) byLevel[lv] = { played: [], unplayed: [] };
    byLevel[lv].unplayed.push(entry);
  }

  const levels = Object.keys(byLevel).map(Number).sort((a, b) => a - b);

  const sortedSections = levels.map(lv => {
    const { played, unplayed } = byLevel[lv];
    const total     = played.length + unplayed.length;
    const hardCount = played.filter(({ s }) => ['HARD', 'EXHARD', 'FC'].includes(lampCat(s.scoreData?.lamp))).length;
    const hardPct   = total > 0 ? Math.round(hardCount / total * 100) : 0;
    const symbol    = (played[0]?.entry ?? unplayed[0])?.level.replace(/\d+$/, '') ?? '';

    const sortedPlayed = played.slice().sort((a, b) => {
      const la = LAMP_ORDER[lampCat(a.s.scoreData?.lamp)] ?? -1;
      const lb = LAMP_ORDER[lampCat(b.s.scoreData?.lamp)] ?? -1;
      return lb - la;
    });

    return `
      <div class="level-section">
        <div class="level-header">
          <span>${symbol}${lv}</span>
          <div class="level-progress"><div class="level-progress-fill" style="width:${hardPct}%"></div></div>
          <span class="level-count">${played.length} / ${total}曲</span>
        </div>
        <div class="score-list">
          ${sortedPlayed.map(({ s, entry }, i) => scoreItemHTML(s, i + 1, entry.level)).join('')}
          ${unplayed.map((entry, i) => unchartedItemHTML(entry, played.length + i + 1)).join('')}
        </div>
      </div>`;
  });

  if (unmatchedScores.length > 0) {
    const sortedUnmatched = unmatchedScores.slice().sort((a, b) => {
      const la = LAMP_ORDER[lampCat(a.s.scoreData?.lamp)] ?? -1;
      const lb = LAMP_ORDER[lampCat(b.s.scoreData?.lamp)] ?? -1;
      return lb - la;
    });
    sortedSections.push(`
      <div class="level-section">
        <div class="level-header">
          <span>-</span>
          <span class="level-count">${sortedUnmatched.length}曲</span>
        </div>
        <div class="score-list">${sortedUnmatched.map(({ s }, i) => scoreItemHTML(s, i + 1, '-')).join('')}</div>
      </div>`);
  }

  listEl.innerHTML = sortedSections.join('');
}

document.querySelectorAll('#page-tables .tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#page-tables .tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    activeTableTab = btn.dataset.table;
    renderTableView();
  });
});

window.__test = {
  setScores: (data) => { allScores = data; },
  setRecommendData: (data) => { recommendData = data; },
  setActiveRecommendTab: (tab) => { activeRecommendTab = tab; }, // 'nudges' | 'toHard' | 'toEasy'
  renderRecommendList,
  setTableData: (entries) => {
    tableIndex = new Map();
    for (const e of entries) {
      const key = e.md5.toLowerCase();
      if (!tableIndex.has(key)) tableIndex.set(key, []);
      tableIndex.get(key).push(e);
    }
    tableDataLoaded = true;
  },
  setActiveTableTab: (tab) => { activeTableTab = tab; },
  renderTableView,
  renderScoreList,
};
