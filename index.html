<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bokuraway</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap');

  :root {
    --bg:        #0f0f14;
    --surface:   #17171f;
    --surface2:  #1e1e2a;
    --border:    #2a2a3a;
    --accent:    #7c6aff;
    --accent2:   #ff6a9b;
    --text:      #d8d8e8;
    --muted:     #6a6a82;
    --c-fc:      #f0abfc;
    --c-exhard:  #ffd700;
    --c-hard:    #f0f0f0;
    --c-clear:   #6ac8ff;
    --c-easy:    #44ff88;
    --c-assist:  #a855f7;
    --c-failed:  #ff4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── titlebar ── */
  #titlebar {
    height: 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    -webkit-app-region: drag;
    user-select: none;
    flex-shrink: 0;
  }
  #titlebar .logo {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #titlebar .user-info {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    -webkit-app-region: no-drag;
  }
  #btn-logout {
    margin-left: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--muted);
    cursor: pointer;
    -webkit-app-region: no-drag;
    transition: color .15s, border-color .15s;
  }
  #btn-logout:hover { color: var(--text); border-color: var(--accent2); }

  /* ── layout ── */
  #app { flex: 1; display: flex; overflow: hidden; }

  /* ── auth screen ── */
  #auth-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  #auth-screen h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #auth-screen p { color: var(--muted); font-size: 14px; }

  /* ── main screen ── */
  #main-screen { display: none; flex: 1; overflow: hidden; }
  #main-screen.active { display: flex; }

  /* ── sidebar ── */
  #sidebar {
    width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 0;
    flex-shrink: 0;
  }
  .nav-item {
    padding: 10px 20px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: color .15s, background .15s;
    border-left: 2px solid transparent;
  }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(124,106,255,.08); }
  .nav-icon { font-size: 16px; }

  /* ── content ── */
  #content { flex: 1; overflow-y: auto; padding: 28px; }
  #content::-webkit-scrollbar { width: 6px; }
  #content::-webkit-scrollbar-track { background: transparent; }
  #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .page { display: none; }
  .page.active { display: block; }

  .page-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 6px;
    color: #fff;
  }
  .page-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }

  /* ── buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border-radius: 6px;
    border: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:hover { opacity: .85; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #5b4de0); color: #fff; }

  /* ── stat grid ── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .stat-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
  .stat-value { font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; color: #fff; }
  .stat-value.c-fc     { color: var(--c-fc); }
  .stat-value.c-hard   { color: var(--c-hard); }
  .stat-value.c-clear  { color: var(--c-clear); }
  .stat-value.c-easy   { color: var(--c-easy); }
  .stat-value.c-accent { color: var(--accent); }

  /* ── tab bar ── */
  .tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 8px 18px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── score list ── */
  .score-list { display: flex; flex-direction: column; gap: 6px; }
  .score-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 16px;
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: center;
    gap: 12px;
    transition: border-color .15s;
  }
  .score-item:hover { border-color: var(--accent); }
  .score-rank {
    font-family: 'Rajdhani', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
  }
  .score-title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-artist {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .bp-badge { font-size: 10px; color: var(--muted); }
  .nudge-badge {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(124,106,255,.12);
    border: 1px solid rgba(124,106,255,.3);
    border-radius: 3px;
    padding: 1px 6px;
    white-space: nowrap;
  }
  .score-item.uncharted { opacity: 0.45; }
  .score-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }

  /* ── lamp badge ── */
  .lamp-badge {
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .lamp-FC     { background: rgba(200,100,255,.12); }
  .lamp-FC .rainbow-text {
    background: linear-gradient(90deg, #ff5555, #ffcc00, #44ee44, #00ccff, #cc55ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lamp-EXHARD { background: rgba(255,215,0,.15);   color: var(--c-exhard); }
  .lamp-HARD   { background: rgba(240,240,240,.12); color: var(--c-hard); }
  .lamp-CLEAR  { background: rgba(106,200,255,.15); color: var(--c-clear); }
  .lamp-EASY   { background: rgba(68,255,136,.15);  color: var(--c-easy); }
  .lamp-ASSIST  { background: rgba(168,85,247,.15);  color: var(--c-assist); }
  .lamp-FAILED  { background: rgba(255,68,68,.15);   color: var(--c-failed); }
  .lamp-NOPLAY  { background: rgba(100,100,120,.12); color: var(--muted); }

  /* ── level badge ── */
  .lv-badge {
    display: inline-block;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  /* ── search input ── */
  .search-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    color: var(--text);
    margin-bottom: 14px;
    width: 100%;
    max-width: 320px;
    display: block;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { outline: none; border-color: var(--accent); }

  /* ── filter bar ── */
  .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 12px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--accent); }
  .filter-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); }

  /* ── stats table ── */
  .stats-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .stats-table th {
    text-align: center;
    padding: 8px 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .stats-table th:first-child { text-align: left; }
  .stats-table td {
    padding: 7px 10px;
    text-align: center;
    border-bottom: 1px solid rgba(42,42,58,.4);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--border);
  }
  .stats-table td:first-child { text-align: left; font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); }
  .stats-table td:last-child { color: var(--muted); font-size: 13px; }
  .stats-table tr:hover td { background: rgba(255,255,255,.015); }
  .cell-fc     { color: var(--c-fc)     !important; }
  .cell-exhard { color: var(--c-exhard) !important; }
  .cell-hard   { color: var(--c-hard)   !important; }
  .cell-clear  { color: var(--c-clear)  !important; }
  .cell-easy   { color: var(--c-easy)   !important; }
  .cell-assist { color: var(--c-assist) !important; }
  .cell-failed { color: var(--c-failed) !important; }

  /* ── level section ── */
  .level-section { margin-bottom: 24px; }
  .level-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
    padding: 6px 0;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .level-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0;
    white-space: nowrap;
  }
  .level-progress {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .level-progress-fill {
    height: 100%;
    background: var(--c-hard);
    border-radius: 2px;
  }

  /* ── status / loader ── */
  .status { font-size: 13px; color: var(--muted); padding: 40px 0; text-align: center; }
  .dot-loader::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 100% { content: ''; }
    25%       { content: '.'; }
    50%       { content: '..'; }
    75%       { content: '...'; }
  }
</style>
</head>
<body>

<div id="titlebar">
  <span class="logo">BOKURAWAY</span>
  <span class="user-info" id="user-chip"></span>
  <button id="btn-logout" style="display:none">ログアウト</button>
</div>

<div id="app">

  <!-- 認証画面 -->
  <div id="auth-screen">
    <h1>BOKURAWAY</h1>
    <p>Bokutachiアカウントでログインして、BMS上達をサポートします</p>
    <button class="btn btn-primary" id="btn-login">⚡ Bokutachiでログイン</button>
    <p id="auth-status" style="font-size:12px;color:var(--muted);min-height:20px"></p>
  </div>

  <!-- メイン画面 -->
  <div id="main-screen">
    <nav id="sidebar">
      <div class="nav-item active" data-page="recommend">
        <span class="nav-icon">🎯</span> レコメンド
      </div>
      <div class="nav-item" data-page="stats">
        <span class="nav-icon">📈</span> ランプ統計
      </div>
      <div class="nav-item" data-page="scores">
        <span class="nav-icon">📊</span> スコア一覧
      </div>
      <div class="nav-item" data-page="tables">
        <span class="nav-icon">📋</span> 難易度表
      </div>
    </nav>

    <div id="content">

      <!-- レコメンドページ -->
      <div class="page active" id="page-recommend">
        <div class="page-title">NEXT CHALLENGE</div>
        <div class="page-sub">上達のための次の一手をレコメンド</div>
        <div id="recommend-stats" class="stat-grid"></div>
        <div class="tab-bar">
          <button class="tab active" data-tab="nudges">🔔 あと一歩</button>
          <button class="tab" data-tab="toHard">HARD CLEAR 狙い</button>
          <button class="tab" data-tab="toEasy">EASY CLEAR 狙い</button>
        </div>
        <div class="score-list" id="recommend-list">
          <div class="status dot-loader">読み込み中</div>
        </div>
      </div>

      <!-- ランプ統計ページ -->
      <div class="page" id="page-stats">
        <div class="page-title">LAMP STATS</div>
        <div class="page-sub">難易度別クリアランプ分布</div>
        <div id="stats-totals" class="stat-grid"></div>
        <div id="stats-table-wrap">
          <div class="status dot-loader">読み込み中</div>
        </div>
      </div>

      <!-- 難易度表ページ -->
      <div class="page" id="page-tables">
        <div class="page-title">DIFFICULTY TABLES</div>
        <div class="page-sub">難易度表別スコア一覧（プレイ済みのみ）</div>
        <div class="tab-bar" id="table-tab-bar">
          <button class="tab active" data-table="insane">発狂難易度</button>
          <button class="tab" data-table="satellite">Satellite</button>
          <button class="tab" data-table="stella">Stella</button>
          <button class="tab" data-table="overjoy">Overjoy</button>
        </div>
        <input type="text" class="search-input" id="table-search" placeholder="曲名・アーティストで検索…">
        <div id="table-stats" class="stat-grid"></div>
        <div class="score-list" id="table-list">
          <div class="status dot-loader">読み込み中</div>
        </div>
      </div>

      <!-- スコアページ -->
      <div class="page" id="page-scores">
        <div class="page-title">SCORE LIST</div>
        <div class="page-sub">ベストスコア一覧</div>
        <input type="text" class="search-input" id="score-search" placeholder="曲名・アーティストで検索…">
        <div class="filter-bar" id="score-filter-bar"></div>
        <div class="score-list" id="score-list">
          <div class="status dot-loader">読み込み中</div>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="./dist/renderer.js"></script>
</body>
</html>
